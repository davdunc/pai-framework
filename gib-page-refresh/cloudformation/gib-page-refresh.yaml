AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Daily refresh of the Gib daemon page on davidduncan.org. Lambda
  reads TELOS data files from the PAI backup S3 prefix, regenerates
  three marked sections (State, Active Projects, Recent Updates) of
  content/pages/gib.md, and commits the updated file to the
  davidduncan.org GitLab repository via the Files API. GitLab CI
  then runs the existing Pelican deploy job.

  Deploy with deploy/deploy.sh. Schedule defaults to 06:05 CT (11:05
  UTC) so it runs five minutes after usmetrics-notion-refresh.

Parameters:

  CodeS3Bucket:
    Type: String
    Default: davdunc-pai-backup
    Description: S3 bucket holding the packaged Lambda zip
  CodeS3Key:
    Type: String
    Description: S3 key of the packaged Lambda zip (uploaded by deploy.sh)
    AllowedPattern: '^cfn-staging/gib-page-refresh/.*\.zip$'

  TelosS3Bucket:
    Type: String
    Default: davdunc-pai-backup
    Description: S3 bucket holding the PAI backup including TELOS files
  TelosS3Prefix:
    Type: String
    Default: 'claude/PAI/USER/TELOS/'
    Description: Key prefix under which STATE.md, PROJECTS_STATUS.md, and Updates.md live

  GitlabHost:
    Type: String
    Default: gitlab.com
  GitlabProjectPath:
    Type: String
    Default: rubackedup-com/davidduncan.org
    Description: GitLab project path (namespace/name) for the site repo
  GitlabBranch:
    Type: String
    Default: gib-page-refresh-bot
    Description: |
      The branch the Lambda commits to. Set to a dedicated bot branch
      so daily TELOS-driven refreshes don't interleave with human
      commits on main. The site's .gitlab-ci.yml is configured to
      deploy from this branch as well as main. Merge bot branch into
      main manually when convenient.
  GitlabToken:
    Type: String
    NoEcho: true
    Description: GitLab Project Access Token with write_repository scope
    MinLength: 20
  GibPagePath:
    Type: String
    Default: content/pages/gib.md

  ScheduleExpression:
    Type: String
    Default: 'cron(5 11 ? * MON-FRI *)'
    Description: 06:05 CT = 11:05 UTC, weekdays only (Mon-Fri)
  EnableSchedule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, 'true']

Resources:

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gib-page-refresh
      RetentionInDays: !Ref LogRetentionDays

  RefreshRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gib-page-refresh-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadTelosFromBackup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${TelosS3Bucket}/${TelosS3Prefix}*'

  RefreshFunction:
    Type: AWS::Lambda::Function
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: gib-page-refresh
      Description: Daily refresh of the Gib daemon page on davidduncan.org
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt RefreshRole.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          GITLAB_HOST: !Ref GitlabHost
          GITLAB_PROJECT_PATH: !Ref GitlabProjectPath
          GITLAB_BRANCH: !Ref GitlabBranch
          GITLAB_TOKEN: !Ref GitlabToken
          GIB_PAGE_PATH: !Ref GibPagePath
          S3_BUCKET: !Ref TelosS3Bucket
          S3_TELOS_PREFIX: !Ref TelosS3Prefix
          LOG_LEVEL: INFO

  # ---------- Optional EventBridge Scheduler (opt-in via parameter) ----------

  RefreshSchedulerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: gib-page-refresh-scheduler-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeRefreshLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RefreshFunction.Arn

  RefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleEnabled
    Properties:
      Name: gib-page-refresh-daily
      Description: Daily Gib daemon page refresh at 06:05 CT (11:05 UTC)
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt RefreshFunction.Arn
        RoleArn: !GetAtt RefreshSchedulerRole.Arn
        Input: '{}'

Outputs:

  FunctionName:
    Value: !Ref RefreshFunction

  FunctionArn:
    Value: !GetAtt RefreshFunction.Arn

  RoleArn:
    Value: !GetAtt RefreshRole.Arn

  LogGroup:
    Value: !Ref RefreshLogGroup

  ManualInvokeCli:
    Description: One-line manual invoke
    Value: !Sub |
      aws --profile pai-linux lambda invoke --function-name ${RefreshFunction} --cli-binary-format raw-in-base64-out --region ${AWS::Region} /tmp/gib-refresh-response.json && cat /tmp/gib-refresh-response.json
