AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Daily USMetrics refresh: Lambda fetches FRED/EIA macro indicators and
  updates the canonical Notion page properties (Doc name timestamp, Date,
  Description of Content with "what changed" + "why it matters" callouts).
  Triggered by EventBridge Scheduler.

  Deploy with the companion deploy/deploy.sh script which uploads the
  Lambda zip to S3 first and passes the resulting key as a parameter.

Parameters:

  CodeS3Bucket:
    Type: String
    Default: davdunc-pai-backup
    Description: S3 bucket holding the packaged Lambda zip
  CodeS3Key:
    Type: String
    Description: S3 key of the packaged Lambda zip (uploaded by deploy.sh)
    AllowedPattern: '^cfn-staging/usmetrics-refresh/.*\.zip$'

  NotionPageId:
    Type: String
    Default: 36e973b9-8fae-8159-9cac-c16f85164ca5
    Description: Notion canonical page id for "US Economic State Analysis"
  NotionToken:
    Type: String
    NoEcho: true
    Description: Notion Internal Integration token (starts with secret_ or ntn_)
    MinLength: 30

  FredApiKey:
    Type: String
    NoEcho: true
    Description: Federal Reserve Economic Data API key
    MinLength: 30
  EiaApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: EIA API key (optional — only used if energy series are queried)

  ScheduleExpression:
    Type: String
    Default: 'cron(0 11 * * ? *)'
    Description: 06:00 CT = 11:00 UTC daily by default
  EnableSchedule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, deploys the Lambda but skips the scheduler entry

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, 'true']

Resources:

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/usmetrics-notion-refresh
      RetentionInDays: !Ref LogRetentionDays

  RefreshRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: usmetrics-notion-refresh-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RefreshFunction:
    Type: AWS::Lambda::Function
    DependsOn: RefreshLogGroup
    Properties:
      FunctionName: usmetrics-notion-refresh
      Description: Daily refresh of FRED/EIA macro data to Notion canonical page
      Runtime: python3.13
      Handler: handler.handler
      Role: !GetAtt RefreshRole.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          NOTION_PAGE_ID: !Ref NotionPageId
          NOTION_INTEGRATION_TOKEN: !Ref NotionToken
          FRED_API_KEY: !Ref FredApiKey
          EIA_API_KEY: !Ref EiaApiKey
          LOG_LEVEL: INFO

  # ---------- Optional EventBridge Scheduler (opt-in via parameter) ----------

  RefreshSchedulerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      RoleName: usmetrics-notion-refresh-scheduler-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeRefreshLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RefreshFunction.Arn

  RefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleEnabled
    Properties:
      Name: usmetrics-notion-refresh-daily
      Description: Daily USMetrics → Notion refresh at 06:00 CT (11:00 UTC)
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt RefreshFunction.Arn
        RoleArn: !GetAtt RefreshSchedulerRole.Arn
        Input: '{}'

Outputs:

  FunctionName:
    Value: !Ref RefreshFunction

  FunctionArn:
    Value: !GetAtt RefreshFunction.Arn

  RoleArn:
    Value: !GetAtt RefreshRole.Arn

  LogGroup:
    Value: !Ref RefreshLogGroup

  ManualInvokeCli:
    Description: One-line manual invoke
    Value: !Sub |
      aws --profile pai-linux lambda invoke --function-name ${RefreshFunction} --cli-binary-format raw-in-base64-out --region ${AWS::Region} /tmp/usmetrics-response.json && cat /tmp/usmetrics-response.json
